# ROXIUM Portal · Netlify configuration
# Static site — no build step needed. Netlify serves the repo root.

[build]
  publish = "."

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Single-page app: serve index.html for all routes (magic-link redirects land cleanly)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
