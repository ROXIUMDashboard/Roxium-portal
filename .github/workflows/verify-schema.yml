name: Verify production schema

# Read-only drift detector. Answers "does the live database still match what this
# repository assumes?" — the question that was unanswerable before this workflow.
#
# DELIBERATELY SEPARATE FROM THE DEPLOY WORKFLOWS. It does not gate
# deploy-pages.yml or deploy-functions.yml, so a red result here can never block a
# release. Once the drift it currently reports is resolved, promote it to a
# required check (or add it as a step in deploy-pages.yml) to make it blocking.
#
# Uses only the PUBLIC anon key already committed in config.js — no secrets.
# Every request is a GET with limit=1: no writes, no RPCs, no emails.

on:
  push:
    branches: ['**']
    paths:
      - 'app.js'
      - 'config.js'
      - 'migrations/**'
      - 'schema.sql'
      - 'scripts/**'
      - '.github/workflows/verify-schema.yml'
  pull_request:
  schedule:
    # weekly drift sweep — catches a migration applied (or forgotten) out of band
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The single cheapest guard that exists for a 6,900-line unbundled file
      # that is deployed straight to production with no build step.
      - name: Syntax-check shipped JavaScript
        run: |
          node --check app.js
          node --check config.js
          for f in scripts/*.mjs; do [ -e "$f" ] && node --check "$f"; done
          echo "JavaScript parses."

      - name: Shell-check repository scripts
        run: |
          for f in scripts/*.sh; do [ -e "$f" ] && bash -n "$f"; done
          echo "Shell scripts parse."

      - name: Verify production schema matches the repository
        run: node scripts/verify-production-schema.mjs

      - name: Explain a failure
        if: failure()
        run: |
          echo "::warning::Production schema does not match this repository."
          echo "A migration in migrations/ has probably not been applied to Supabase."
          echo "Full picture (indexes, triggers, functions, RLS policy bodies):"
          echo "  run scripts/verify-production-schema.sql in the Supabase SQL editor."
