name: Deploy Portal to Cloudflare Pages

# Deploys static portal files on push to main (or manual "Run workflow").
# Requires GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional variable: CLOUDFLARE_PAGES_PROJECT (default: roxium-portal)
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'config.js'
      - '_headers'
      - '_redirects'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

env:
  PAGES_PROJECT: roxium-portal

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site bundle
        run: |
          mkdir -p site
          cp index.html app.js styles.css config.js _headers site/
          if [ -f _redirects ]; then cp _redirects site/; fi
          echo "Files to deploy:"
          ls -la site/

      - name: Setup Wrangler
        run: npm install -g wrangler@4

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "Checking API token…"
          wrangler whoami
          echo ""
          echo "Pages projects in this account:"
          wrangler pages project list || true

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="${{ env.PAGES_PROJECT }}"
          if wrangler pages project list 2>/dev/null | grep -q "$PROJECT"; then
            echo "Pages project '$PROJECT' already exists."
          else
            echo "Creating Pages project '$PROJECT' (production branch: main)…"
            wrangler pages project create "$PROJECT" --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MSG="${{ github.event.head_commit.message || 'Manual workflow deploy' }}"
          wrangler pages deploy site \
            --project-name="${{ env.PAGES_PROJECT }}" \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$MSG"
          echo ""
          echo "=== Deployment registered on project: ${{ env.PAGES_PROJECT }} ==="
          echo "Open: https://dash.cloudflare.com → Workers & Pages → ${{ env.PAGES_PROJECT }} → Deployments"
          wrangler pages deployment list --project-name="${{ env.PAGES_PROJECT }}" --environment=production | head -20
