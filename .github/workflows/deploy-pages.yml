name: Deploy Portal to Cloudflare Pages

# The ONE production deploy path for the static portal.
# Run scripts/prepare-pages.sh → upload site/ (never the raw repo root).
#
# Requires GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# Do NOT also connect this repo as a Cloudflare dashboard "Git integration" (Pages or
# Workers). A second auto-build races this Action for the project `roxium-portal` and
# produces preview-only / stale deploys. The Cloudflare Worker path was removed
# (wrangler.jsonc / .assetsignore deleted). See docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PAGES_PROJECT: roxium-portal

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Build static site bundle
        run: bash scripts/prepare-pages.sh

      - name: Setup Wrangler
        run: npm install -g wrangler@4

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          wrangler whoami
          echo ""
          wrangler pages project list || true

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="${{ env.PAGES_PROJECT }}"
          if wrangler pages project list 2>/dev/null | grep -q "$PROJECT"; then
            echo "Pages project '$PROJECT' exists."
          else
            wrangler pages project create "$PROJECT" --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MSG="${{ github.event.head_commit.message || 'Deploy from GitHub Actions' }}"
          wrangler pages deploy site \
            --project-name="${{ env.PAGES_PROJECT }}" \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$MSG"
          echo ""
          echo "Deployed commit ${{ github.sha }} (short $(echo ${{ github.sha }} | cut -c1-7))"
          echo "Verify: https://${{ env.PAGES_PROJECT }}.pages.dev"
          wrangler pages deployment list --project-name="${{ env.PAGES_PROJECT }}" --environment=production | head -10
