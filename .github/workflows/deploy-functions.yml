name: Deploy Supabase Edge Functions

# Deploys EVERY Edge Function under supabase/functions/ to Supabase whenever any of
# them changes on main (or on demand via "Run workflow"). Previously only
# sync-coefficient was deployed, so notify-client / notify-video-ready / invite-user
# / asana-* silently drifted and never went live. Each function enforces its own auth
# (team-JWT check, shared sync key, or external webhook), so all deploy with
# --no-verify-jwt and gate access internally.
#
# Requires GitHub secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ "$name" = "_shared" ] && continue
            echo "::group::deploy $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --no-verify-jwt
            echo "::endgroup::"
          done
