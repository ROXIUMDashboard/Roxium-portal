name: Deploy Supabase Edge Functions

# Deploys EVERY Edge Function under supabase/functions/ to Supabase whenever any of
# them changes on main (or on demand via "Run workflow"). Previously only
# sync-coefficient was deployed, so notify-client / notify-video-ready / invite-user
# / asana-* silently drifted and never went live. Each function enforces its own auth
# (team-JWT check, shared sync key, or external webhook), so all deploy with
# --no-verify-jwt and gate access internally.
#
# Requires GitHub secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # NOTE: no `-e` — a single flaky function must not abort the whole job.
          # esm.sh (which the functions import supabase-js from) intermittently
          # returns 522/timeout during bundling, so retry each function a few
          # times and only fail the job if a function is still broken at the end.
          set -uo pipefail
          fail=0
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ "$name" = "_shared" ] && continue
            ok=0
            for attempt in 1 2 3; do
              echo "::group::deploy $name (attempt $attempt/3)"
              if supabase functions deploy "$name" --project-ref "$PROJECT_REF" --no-verify-jwt; then
                ok=1; echo "::endgroup::"; break
              fi
              echo "::endgroup::"
              echo "deploy of $name failed (attempt $attempt) — retrying after backoff"
              sleep $((attempt * 10))
            done
            if [ "$ok" != "1" ]; then
              echo "::error::failed to deploy $name after 3 attempts"; fail=1
            fi
          done
          exit $fail
