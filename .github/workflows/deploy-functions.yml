name: Deploy Supabase Edge Functions

# Edge Functions are NOT deployed by Netlify or by merging a PR — they live in
# Supabase and must be pushed with the Supabase CLI. This deploys sync-coefficient
# automatically whenever its code changes on main (and on-demand via "Run workflow").
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/sync-coefficient/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy sync-coefficient
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy sync-coefficient --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
