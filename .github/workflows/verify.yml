name: Verify

# Runs on every branch and pull request. Nothing here touches any environment:
# it builds the bundle locally, serves it, and tests it. No secrets required.
#
# This is the gate both deploy workflows call before they are allowed to ship.

on:
  push:
    # main is covered by deploy-staging.yml, which calls this workflow.
    branches-ignore: [main]
  pull_request:
  schedule:
    # weekly drift sweep — catches a migration applied (or forgotten) out of band
    - cron: '17 6 * * 1'
  workflow_dispatch: {}
  workflow_call: {}          # invoked by deploy-staging / deploy-production

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The cheapest possible guard for a 6,900-line unbundled file that is
      # deployed straight to production with no build step.
      - name: Syntax-check shipped JavaScript
        run: |
          node --check app.js
          node --check config.js
          for f in scripts/*.mjs scripts/lib/*.mjs; do [ -e "$f" ] && node --check "$f"; done
          echo "JavaScript parses."

      - name: Shell-check repository scripts
        run: |
          for f in scripts/*.sh; do [ -e "$f" ] && bash -n "$f"; done
          echo "Shell scripts parse."

      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }

      # A REAL GATE. This step was `continue-on-error: true` and therefore
      # reported SUCCESS while `deno check` was failing with 12 type errors —
      # Verify was green on a check that did not pass. The errors are fixed and
      # the suppression is gone; a type error now fails Verify, which blocks both
      # deploy workflows.
      #
      # The comment that justified the suppression said remote imports can be
      # flaky. If esm.sh ever does fail here, the fix is to pin or vendor the
      # import — not to make the gate advisory again.
      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/_shared/*.ts supabase/functions/*/index.ts
          echo "Edge Functions type-check clean."

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end tests (offline harness)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Read-only: uses the public anon key from config.js. No secrets.
      - name: Production schema drift check
        run: npm run verify:schema

      - name: Explain a schema failure
        if: failure()
        run: |
          echo "::warning::Production schema may not match this repository."
          echo "Run scripts/verify-production-schema.sql in the Supabase SQL editor for the full picture."

  # ---------------------------------------------------------------------------
  # Initialize STAGING must survive being run twice.
  #
  # Initialize STAGING #2 died with "cannot change return type of existing
  # function" on a healthy database: the bootstrap is schema.sql plus the whole
  # migration history, and delete_practice(uuid) changes its return type partway
  # through that history, so the older definition cannot be replayed over the
  # newer one.
  #
  # Nothing short of a real Postgres catches that, so this job stands one up,
  # applies the real generated bootstrap, and proves the first-run / second-run /
  # partial-state behaviour. It touches no Supabase project and holds no secrets.
  # ---------------------------------------------------------------------------
  idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: First run, second run, and partial-state refusal
        env:
          ROXIUM_TEST_PG: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node --test tests/integration/staging-idempotency.test.mjs

      # The seeder is the other half of "safe to re-run": the schema can be
      # idempotent while the data load still cannot survive a second attempt.
      # These tests fail hard rather than skip when Postgres is missing, so a
      # broken service container cannot turn this into a green no-op.
      - name: Seeder converges, recovers from a partial seed, and refuses real data
        env:
          ROXIUM_TEST_PG: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node --test tests/integration/staging-seed.test.mjs
